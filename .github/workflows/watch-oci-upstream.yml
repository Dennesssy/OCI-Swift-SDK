name: Watch OCI upstream releases

on:
  schedule:
    # oci-go-sdk releases ~weekly (Mon). Check Mondays 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query latest oci-go-sdk release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'oracle',
              repo: 'oci-go-sdk',
            });
            core.setOutput('tag', data.tag_name);
            core.setOutput('published', data.published_at || '');

      - name: Compare with tracked version
        id: compare
        run: |
          TRACKED=$(cat .oci-upstream/last-version 2>/dev/null || echo none)
          echo "tracked=$TRACKED"
          echo "latest=${{ steps.latest.outputs.tag }}"
          if [ -n "$TRACKED" ] && [ "$TRACKED" = "${{ steps.latest.outputs.tag }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue + record new version
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.latest.outputs.tag }}';
            const published = '${{ steps.latest.outputs.published }}';
            const body = [
              `New upstream \`oracle/oci-go-sdk\` release: **${tag}** (published ${published}).`,
              '',
              'This SDK generates service clients from oci-go-sdk sources (`tools/gen/gen.py`).',
              'Next steps: run the generator, build, test, then ship updated clients.',
            ].join('\n');
            const fs = require('fs');
            fs.mkdirSync('.oci-upstream', { recursive: true });
            fs.writeFileSync('.oci-upstream/last-version', tag + '\n');
            await exec.exec('git', ['config', 'user.name', 'oci-update-watch']);
            await exec.exec('git', ['config', 'user.email', 'actions@users.noreply.github.com']);
            await exec.exec('git', ['add', '.oci-upstream/last-version']);
            await exec.exec('git', ['commit', '-m', `Track upstream oci-go-sdk ${tag}`]);
            await exec.exec('git', ['push']);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream OCI update: ${tag}`,
              body,
              labels: ['oci-update'],
            });
