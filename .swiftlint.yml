# SwiftLint Configuration for OCI-Swift-SDK
# https://github.com/realm/SwiftLint

excluded:
  - .git
  - .build
  - DerivedData

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - force_try
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - let_var_whitespace
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_calls
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - trailing_comma
  - line_length

# Rule configurations
file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 10

type_body_length:
  warning: 300
  error: 500

type_name:
  min_length: 3
  max_length: 60

identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - ok
    - x
    - y

nesting:
  type_level:
    warning: 3
  statement_level:
    warning: 5

reporter: "xcode"
